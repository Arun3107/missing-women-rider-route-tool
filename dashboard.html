<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Missing Women Logs Dashboard</title>

    <style>
      :root {
        --bg: #eef2f7;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #64748b;
        --border: #e2e8f0;
        --dark: #0f172a;
        --green: #16a34a;
        --orange: #f97316;
        --blue: #2563eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .shell {
        max-width: 1120px;
        margin: 0 auto;
        padding: 18px;
      }

      .hero {
        background: linear-gradient(135deg, #0f172a, #1e293b);
        color: white;
        border-radius: 22px;
        padding: 20px;
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.18);
        margin-bottom: 16px;
      }

      .hero-top {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: flex-start;
      }

      .hero-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }

      .type-select {
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.08);
        color: white;
        border-radius: 999px;
        padding: 10px 13px;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        white-space: nowrap;
      }

      .type-select option {
        color: #0f172a;
        background: white;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 24px;
        letter-spacing: -0.03em;
      }

      .subtitle {
        color: #cbd5e1;
        font-size: 13px;
        line-height: 1.4;
        margin: 0;
      }

      .header-action {
        border: 1px solid rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.08);
        color: white;
        border-radius: 999px;
        padding: 10px 13px;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
        white-space: nowrap;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 16px;
      }

      .stat {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 12px;
      }

      .stat .label {
        color: #cbd5e1;
        font-size: 11px;
        margin-bottom: 4px;
      }

      .stat .value {
        font-weight: 900;
        font-size: 20px;
      }

      .toolbar {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 12px;
        display: grid;
        gap: 10px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        margin-bottom: 14px;
      }

      .filters {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      select,
      input {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        font-size: 14px;
        background: #fff;
        color: var(--text);
      }

      .helper {
        color: var(--muted);
        font-size: 12px;
      }

      .list {
        display: grid;
        gap: 12px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 14px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      }

      .log-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
        margin-bottom: 10px;
      }

      .day-badge {
        background: #dcfce7;
        color: #166534;
        border-radius: 999px;
        padding: 5px 9px;
        font-size: 11px;
        font-weight: 900;
        white-space: nowrap;
      }

      .title {
        font-weight: 900;
        font-size: 15px;
        margin-bottom: 3px;
      }

      .time {
        color: var(--muted);
        font-size: 12px;
      }

      .chips {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 10px 0;
      }

      .chip {
        background: #f1f5f9;
        color: #334155;
        border-radius: 999px;
        padding: 6px 9px;
        font-size: 12px;
        font-weight: 700;
      }

      .chip.address {
        border-radius: 12px;
        max-width: 100%;
        line-height: 1.35;
      }

      .note {
        background: #fff7ed;
        color: #7c2d12;
        border-radius: 12px;
        padding: 10px;
        font-size: 13px;
        margin: 10px 0;
        white-space: pre-wrap;
      }

      .photo {
        display: block;
        width: 100%;
        max-height: 360px;
        object-fit: cover;
        border-radius: 14px;
        border: 1px solid var(--border);
        margin-top: 10px;
        background: #f8fafc;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .card-actions-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-top: 10px;
      }

      .edit-btn {
        border: 0;
        background: #0f172a;
        color: white;
        border-radius: 999px;
        padding: 9px 13px;
        font-size: 12px;
        font-weight: 900;
        cursor: pointer;
        margin-left: auto;
      }

      .edit-panel-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.52);
        display: none;
        align-items: flex-end;
        justify-content: center;
        z-index: 9999;
        padding: 14px;
      }

      .edit-panel-backdrop.open {
        display: flex;
      }

      .edit-panel {
        width: min(100%, 520px);
        background: white;
        border-radius: 20px;
        padding: 16px;
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.3);
      }

      .edit-panel h2 {
        margin: 0 0 4px;
        font-size: 20px;
      }

      .edit-subtitle {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 14px;
      }

      .edit-grid {
        display: grid;
        gap: 10px;
      }

      .edit-field label {
        display: block;
        font-size: 12px;
        font-weight: 800;
        margin-bottom: 5px;
        color: #334155;
      }

      .edit-field textarea {
        width: 100%;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        font-size: 14px;
        resize: vertical;
        min-height: 86px;
        font-family: inherit;
      }

      .edit-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 14px;
      }

      .edit-actions button {
        border: 0;
        border-radius: 999px;
        padding: 11px 15px;
        font-size: 13px;
        font-weight: 900;
        cursor: pointer;
      }

      .cancel-edit {
        background: #e5e7eb;
        color: #0f172a;
      }

      .save-edit {
        background: #16a34a;
        color: white;
      }

      .link-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        border-radius: 999px;
        padding: 9px 12px;
        font-size: 12px;
        font-weight: 900;
        color: white;
        background: var(--dark);
      }

      .link-btn.map {
        background: var(--blue);
      }

      .empty,
      .error {
        text-align: center;
        padding: 28px 18px;
        color: var(--muted);
      }

      .error {
        color: #991b1b;
      }

      @media (min-width: 720px) {
        .shell {
          padding: 24px;
        }

        .stats {
          grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .filters {
          grid-template-columns: 180px 1fr 180px;
          align-items: center;
        }

        .list {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div class="hero-top">
          <div>
            <h1 id="dashboardTitle">Noise Logs Dashboard</h1>
            <p class="subtitle" id="dashboardSubtitle">
              Live field logs with GPS, min/max dB readings, notes, and photos.
            </p>
          </div>
          <div class="hero-actions">
            <select
              id="logTypeSelect"
              class="type-select"
              onchange="changeLogType()"
            >
              <option value="noise">Noise</option>
              <option value="pollution">Pollution</option>
            </select>
            <button class="header-action" onclick="downloadCsv()">
              Download CSV
            </button>
            <button class="header-action" onclick="reloadDashboard()">
              Refresh
            </button>
          </div>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="label">Total logs</div>
            <div class="value" id="totalLogs">--</div>
          </div>
          <div class="stat">
            <div class="label" id="secondaryMetricLabel">Min dB seen</div>
            <div class="value" id="secondaryMetricValue">--</div>
          </div>
          <div class="stat">
            <div class="label" id="maxMetricLabel">Max dB seen</div>
            <div class="value" id="maxDbSeen">--</div>
          </div>
          <div class="stat">
            <div class="label">Active days</div>
            <div class="value" id="activeDays">--</div>
          </div>
        </div>
      </section>

      <section class="toolbar">
        <div class="filters">
          <select id="dayFilter">
            <option value="">All Days</option>
          </select>
          <input
            id="searchInput"
            type="search"
            placeholder="Search trip, note, day..."
          />
          <select id="photoFilter">
            <option value="">All Logs</option>
            <option value="with-photo">With Photo</option>
            <option value="without-photo">Without Photo</option>
          </select>
        </div>
        <div class="helper" id="resultInfo">Loading logs...</div>
      </section>

      <section id="list" class="list"></section>

      <div id="editPanelBackdrop" class="edit-panel-backdrop">
        <div class="edit-panel">
          <h2 id="editTitle">Edit Log</h2>
          <div id="editSubtitle" class="edit-subtitle"></div>
          <div id="editFields" class="edit-grid"></div>
          <div class="edit-actions">
            <button class="cancel-edit" onclick="closeEditPanel()">
              Cancel
            </button>
            <button class="save-edit" onclick="saveEditedLog()">
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </main>

    <script>
      const SUPABASE_URL = "https://rpkmdnqkhfbbvuzlvozs.supabase.co";
      const SUPABASE_KEY =
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJwa21kbnFraGZiYnZ1emx2b3pzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc1MDgwMTksImV4cCI6MjA3MzA4NDAxOX0.OZ4anxunvuVAypmoURVxmsPIeQv6aniGh6jRZdIU104";

      const LOG_CONFIG = {
        noise: {
          table: "noise_logs",
          title: "Noise Logs Dashboard",
          subtitle:
            "Live field logs with GPS, min/max dB readings, notes, and photos.",
          maxLabel: "Max dB seen",
          secondaryLabel: "Min dB seen",
          csvFilePrefix: "missing-women-noise-logs",
          searchFields: ["day", "title", "note", "min_db", "max_db"],
          editableFields: [
            { key: "min_db", label: "Min dB", type: "number" },
            { key: "max_db", label: "Max dB", type: "number" },
            { key: "note", label: "Note", type: "textarea" },
          ],
          headers: [
            "day",
            "trip_title",
            "captured_at",
            "min_db",
            "max_db",
            "latitude",
            "longitude",
            "address",
            "note",
            "photo_url",
          ],
          rowValues(log) {
            return [
              log.day,
              log.title,
              log.captured_at,
              log.min_db,
              log.max_db,
              log.latitude,
              log.longitude,
              getAddressForLog(log),
              log.note,
              photoSrc(log),
            ];
          },
          metricChips(log) {
            return `
              <span class="chip">Min dB: ${escapeHtml(log.min_db ?? "--")}</span>
              <span class="chip">Max dB: ${escapeHtml(log.max_db ?? "--")}</span>
            `;
          },
          maxMetric(logs) {
            return logs.reduce(
              (max, l) => Math.max(max, Number(l.max_db || 0)),
              0,
            );
          },
          secondaryMetric(logs) {
            const values = logs
              .map((l) => Number(l.min_db))
              .filter((value) => !Number.isNaN(value));
            return values.length ? Math.min(...values) : 0;
          },
        },
        pollution: {
          table: "pollution_logs",
          title: "Pollution Logs Dashboard",
          subtitle: "Live field logs with GPS, PM 2.5, CO, notes, and photos.",
          maxLabel: "Max PM 2.5 seen",
          secondaryLabel: "Max CO seen",
          csvFilePrefix: "missing-women-pollution-logs",
          searchFields: ["day", "title", "note", "pm25", "co"],
          editableFields: [
            { key: "pm25", label: "PM 2.5", type: "number" },
            { key: "co", label: "CO", type: "number" },
            { key: "note", label: "Note", type: "textarea" },
          ],
          headers: [
            "day",
            "trip_title",
            "captured_at",
            "pm25",
            "co",
            "latitude",
            "longitude",
            "address",
            "note",
            "photo_url",
          ],
          rowValues(log) {
            return [
              log.day,
              log.title,
              log.captured_at,
              log.pm25,
              log.co,
              log.latitude,
              log.longitude,
              getAddressForLog(log),
              log.note,
              photoSrc(log),
            ];
          },
          metricChips(log) {
            return `
              <span class="chip">PM 2.5: ${escapeHtml(log.pm25 ?? "--")}</span>
              <span class="chip">CO: ${escapeHtml(log.co ?? "--")}</span>
            `;
          },
          maxMetric(logs) {
            return logs.reduce(
              (max, l) => Math.max(max, Number(l.pm25 || 0)),
              0,
            );
          },
          secondaryMetric(logs) {
            return logs.reduce((max, l) => Math.max(max, Number(l.co || 0)), 0);
          },
        },
      };

      let activeLogType = "noise";
      let editingLogId = null;

      let allLogs = [];
      const addressCacheKey = "missingWomenAddressCache";
      let addressCache = loadAddressCache();

      function loadAddressCache() {
        try {
          return JSON.parse(localStorage.getItem(addressCacheKey) || "{}");
        } catch {
          return {};
        }
      }

      function saveAddressCache() {
        localStorage.setItem(addressCacheKey, JSON.stringify(addressCache));
      }

      function coordinateKey(lat, lng) {
        return `${Number(lat).toFixed(5)},${Number(lng).toFixed(5)}`;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function csvEscape(value) {
        const text = String(value ?? "");
        return `"${text.replaceAll('"', '""')}"`;
      }

      async function fetchLogs() {
        const config = LOG_CONFIG[activeLogType];
        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/${config.table}?select=*&order=captured_at.desc`,
          {
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`,
            },
          },
        );

        if (!res.ok) {
          const text = await res.text();
          throw new Error(`Supabase fetch failed: ${res.status} ${text}`);
        }

        return res.json();
      }

      function photoSrc(log) {
        return log.photo_url || log.photo_data_url || "";
      }

      function getAddressForLog(log) {
        if (!log.latitude || !log.longitude) return "No GPS";
        const key = coordinateKey(log.latitude, log.longitude);
        return addressCache[key] || `${log.latitude}, ${log.longitude}`;
      }

      async function reverseGeocode(lat, lng) {
        const key = coordinateKey(lat, lng);
        if (addressCache[key]) return addressCache[key];

        const res = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lng)}&zoom=18&addressdetails=1`,
          {
            headers: {
              Accept: "application/json",
            },
          },
        );

        if (!res.ok) return null;

        const data = await res.json();
        const address = data.display_name || null;

        if (address) {
          addressCache[key] = address;
          saveAddressCache();
        }

        return address;
      }

      async function hydrateAddresses(logs) {
        const uniqueCoordinates = [];
        const seen = new Set();

        logs.forEach((log) => {
          if (!log.latitude || !log.longitude) return;
          const key = coordinateKey(log.latitude, log.longitude);
          if (addressCache[key] || seen.has(key)) return;
          seen.add(key);
          uniqueCoordinates.push({ lat: log.latitude, lng: log.longitude });
        });

        for (const coord of uniqueCoordinates.slice(0, 40)) {
          try {
            await reverseGeocode(coord.lat, coord.lng);
            await new Promise((resolve) => setTimeout(resolve, 1100));
          } catch (err) {
            console.warn("Address lookup failed", err);
          }
        }
      }

      function updateStats(logs) {
        const config = LOG_CONFIG[activeLogType];
        const days = [...new Set(logs.map((l) => l.day).filter(Boolean))];
        const maxMetric = config.maxMetric(logs);
        const secondaryMetric = config.secondaryMetric(logs);

        document.getElementById("totalLogs").textContent = logs.length;
        document.getElementById("secondaryMetricLabel").textContent =
          config.secondaryLabel;
        document.getElementById("secondaryMetricValue").textContent =
          secondaryMetric ? secondaryMetric : "--";
        document.getElementById("maxMetricLabel").textContent = config.maxLabel;
        document.getElementById("maxDbSeen").textContent = maxMetric
          ? maxMetric
          : "--";
        document.getElementById("activeDays").textContent = days.length;
      }

      function setupFilter(logs) {
        const select = document.getElementById("dayFilter");
        const days = [...new Set(logs.map((l) => l.day).filter(Boolean))].sort(
          (a, b) => a - b,
        );

        select.innerHTML = `<option value="">All Days</option>`;
        days.forEach((d) => {
          const opt = document.createElement("option");
          opt.value = d;
          opt.textContent = `Day ${d}`;
          select.appendChild(opt);
        });
      }

      function filteredLogs() {
        const config = LOG_CONFIG[activeLogType];
        const day = document.getElementById("dayFilter").value;
        const search = document
          .getElementById("searchInput")
          .value.trim()
          .toLowerCase();
        const photoFilter = document.getElementById("photoFilter").value;

        return allLogs.filter((log) => {
          const matchesDay = day ? String(log.day) === String(day) : true;
          const combined = config.searchFields
            .map((field) => log[field] || "")
            .join(" ")
            .toLowerCase();
          const matchesSearch = search ? combined.includes(search) : true;
          const hasPhoto = Boolean(photoSrc(log));
          const matchesPhoto =
            photoFilter === "with-photo"
              ? hasPhoto
              : photoFilter === "without-photo"
                ? !hasPhoto
                : true;

          return matchesDay && matchesSearch && matchesPhoto;
        });
      }

      function render() {
        const logs = filteredLogs();
        const list = document.getElementById("list");
        document.getElementById("resultInfo").textContent =
          `${logs.length} log${logs.length === 1 ? "" : "s"} shown`;

        if (!logs.length) {
          list.innerHTML = `<div class="card empty">No logs found for the selected filters.</div>`;
          return;
        }

        list.innerHTML = logs
          .map((l) => {
            const src = photoSrc(l);
            const mapUrl =
              l.latitude && l.longitude
                ? `https://www.google.com/maps?q=${encodeURIComponent(`${l.latitude},${l.longitude}`)}`
                : "";

            return `
              <article class="card">
                <div class="log-head">
                  <div>
                    <div class="title">${escapeHtml(l.title || "Untitled Trip")}</div>
                    <div class="time">${l.captured_at ? new Date(l.captured_at).toLocaleString() : "No timestamp"}</div>
                  </div>
                  <div class="day-badge">Day ${escapeHtml(l.day || "--")}</div>
                </div>

                <div class="chips">
                  ${LOG_CONFIG[activeLogType].metricChips(l)}
                  <span class="chip address">${escapeHtml(getAddressForLog(l))}</span>
                </div>

                ${l.note ? `<div class="note">${escapeHtml(l.note)}</div>` : ""}
                ${src ? `<a href="${src}" target="_blank" rel="noopener"><img class="photo" src="${src}" alt="Noise log photo" loading="lazy" /></a>` : ""}

                <div class="card-actions-row">
                  <div class="actions">
                    ${src ? `<a class="link-btn" href="${src}" target="_blank" rel="noopener">Open Photo</a>` : ""}
                    ${mapUrl ? `<a class="link-btn map" href="${mapUrl}" target="_blank" rel="noopener">Open Map</a>` : ""}
                    ${l.latitude && l.longitude ? `<span class="chip">${escapeHtml(l.latitude)}, ${escapeHtml(l.longitude)}</span>` : ""}
                  </div>
                  <button class="edit-btn" onclick="openEditPanel('${escapeHtml(l.id)}')">Edit</button>
                </div>
              </article>
            `;
          })
          .join("");
      }
      function openEditPanel(logId) {
        const log = allLogs.find((item) => String(item.id) === String(logId));
        if (!log) return;

        editingLogId = logId;
        const config = LOG_CONFIG[activeLogType];
        document.getElementById("editTitle").textContent =
          activeLogType === "noise" ? "Edit Noise Log" : "Edit Pollution Log";
        document.getElementById("editSubtitle").textContent =
          `Day ${log.day || "--"} - ${log.title || "Untitled Trip"}`;

        document.getElementById("editFields").innerHTML = config.editableFields
          .map((field) => {
            const value = log[field.key] ?? "";
            if (field.type === "textarea") {
              return `
                <div class="edit-field">
                  <label>${escapeHtml(field.label)}</label>
                  <textarea data-edit-field="${escapeHtml(field.key)}">${escapeHtml(value)}</textarea>
                </div>
              `;
            }

            return `
              <div class="edit-field">
                <label>${escapeHtml(field.label)}</label>
                <input data-edit-field="${escapeHtml(field.key)}" type="number" step="any" value="${escapeHtml(value)}" />
              </div>
            `;
          })
          .join("");

        document.getElementById("editPanelBackdrop").classList.add("open");
      }

      function closeEditPanel() {
        editingLogId = null;
        document.getElementById("editPanelBackdrop").classList.remove("open");
      }

      async function saveEditedLog() {
        if (!editingLogId) return;

        const config = LOG_CONFIG[activeLogType];
        const inputs = document.querySelectorAll("[data-edit-field]");
        const payload = {};

        inputs.forEach((input) => {
          const key = input.dataset.editField;
          const fieldConfig = config.editableFields.find(
            (field) => field.key === key,
          );
          if (!fieldConfig) return;

          if (fieldConfig.type === "number") {
            payload[key] =
              input.value.trim() === "" ? null : Number(input.value);
          } else {
            payload[key] = input.value.trim() === "" ? null : input.value;
          }
        });

        const res = await fetch(
          `${SUPABASE_URL}/rest/v1/${config.table}?id=eq.${encodeURIComponent(editingLogId)}`,
          {
            method: "PATCH",
            headers: {
              apikey: SUPABASE_KEY,
              Authorization: `Bearer ${SUPABASE_KEY}`,
              "Content-Type": "application/json",
              Prefer: "return=representation",
            },
            body: JSON.stringify(payload),
          },
        );

        if (!res.ok) {
          const text = await res.text();
          alert(`Update failed:\n\n${text}`);
          return;
        }

        const updatedRows = await res.json();
        const updated = updatedRows?.[0];
        if (updated) {
          allLogs = allLogs.map((log) =>
            String(log.id) === String(editingLogId) ? updated : log,
          );
        }

        closeEditPanel();
        updateStats(allLogs);
        render();
      }

      function downloadCsv() {
        const config = LOG_CONFIG[activeLogType];
        const logs = filteredLogs();

        if (!logs.length) {
          alert("No logs available to download for the selected filters.");
          return;
        }

        const rows = logs.map((log) => config.rowValues(log));

        const csv = [
          config.headers.map(csvEscape).join(","),
          ...rows.map((row) => row.map(csvEscape).join(",")),
        ].join("\n");

        const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        const stamp = new Date()
          .toISOString()
          .slice(0, 19)
          .replace(/[:T]/g, "-");

        link.href = url;
        link.download = `${config.csvFilePrefix}-${stamp}.csv`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function applyDashboardConfig() {
        const config = LOG_CONFIG[activeLogType];
        document.getElementById("dashboardTitle").textContent = config.title;
        document.getElementById("dashboardSubtitle").textContent =
          config.subtitle;
        document.getElementById("searchInput").placeholder =
          activeLogType === "noise"
            ? "Search trip, note, day..."
            : "Search trip, PM 2.5, CO, note, day...";
      }

      function changeLogType() {
        activeLogType = document.getElementById("logTypeSelect").value;
        allLogs = [];
        applyDashboardConfig();
        reloadDashboard();
      }

      async function reloadDashboard() {
        document.getElementById("list").innerHTML =
          `<div class="card empty">Loading logs...</div>`;
        applyDashboardConfig();
        try {
          allLogs = await fetchLogs();
          setupFilter(allLogs);
          updateStats(allLogs);
          render();
          hydrateAddresses(allLogs).then(render);
        } catch (err) {
          console.error(err);
          document.getElementById("list").innerHTML =
            `<div class="card error">${escapeHtml(err.message)}</div>`;
          document.getElementById("resultInfo").textContent =
            "Unable to load logs";
        }
      }

      document.getElementById("dayFilter").addEventListener("change", render);
      document.getElementById("searchInput").addEventListener("input", render);
      document.getElementById("photoFilter").addEventListener("change", render);

      reloadDashboard();
    </script>
  </body>
</html>
